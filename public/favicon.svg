<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Modern Gradient for Capital H -->
    <linearGradient id="hactto-h-grad" x1="5.5" y1="7.5" x2="24.5" y2="26.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#3182f6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- 3D Spherical Radial Gradient for Yellow Lotto Ball -->
    <radialGradient id="hactto-lotto-yellow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffde7" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="65%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>

    <!-- Subtle Drop Shadow for Lotto Ball Separation -->
    <filter id="hactto-ball-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Capital Letter H -->
  <!-- Left Pillar -->
  <rect x="5.5" y="7.5" width="5.5" height="19" rx="2" fill="url(#hactto-h-grad)" />
  <!-- Center Crossbar -->
  <rect x="9.5" y="14" width="12" height="5" rx="1.5" fill="url(#hactto-h-grad)" />
  <!-- Right Pillar -->
  <rect x="18" y="7.5" width="5.5" height="19" rx="2" fill="url(#hactto-h-grad)" />

  <!-- Yellow Lotto Ball perched at the Top-Right of H -->
  <g filter="url(#hactto-ball-shadow)">
    <!-- Ball Outer Body with 3D Spherical Gradient -->
    <circle
      cx="23.5"
      cy="7"
      r="5"
      fill="url(#hactto-lotto-yellow)"
      stroke="#ffffff"
      stroke-width="0.9"
    />

    <!-- Inner White Circular Badge (Korean Lotto 6/45 Style) -->
    <circle cx="23.5" cy="7" r="2.3" fill="#ffffff" />

    <!-- Lotto Number 7 -->
    <text
      x="23.5"
      y="8.1"
      font-size="2.8"
      font-weight="900"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      text-anchor="middle"
      fill="#854d0e"
    >7</text>

    <!-- Glossy Specular Light Reflection -->
    <ellipse
      cx="22"
      cy="4.8"
      rx="1.3"
      ry="0.65"
      transform="rotate(-30 22 4.8)"
      fill="#ffffff"
      opacity="0.85"
    />
  </g>
</svg>
